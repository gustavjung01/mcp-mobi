name: mcp_field
description: "MCP Field native mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  http: ^1.2.2
  image: ^4.5.4
  image_picker: ^1.1.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - nguyen-lieu-pha-che.webp

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/mcp-field-icon.png"
  adaptive_icon_background: "#0B356D"
  adaptive_icon_foreground: "branding/mcp-field-icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: branding/mcp-field-icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: branding/mcp-field-icon.png

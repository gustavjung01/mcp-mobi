name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.2
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=MCP_API_BASE_URL=https://68.233.111.135
          --dart-define=MCP_UPDATE_BASE_URL=https://pub-7d2987fab97d4e3ebb2021a823973862.r2.dev/mcp-filed

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-field-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
